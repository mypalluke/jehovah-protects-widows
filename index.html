    const Network = ({className}) => (

        <rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/>

    const outlineData = [
      {
        id: 'intro',
        sectionTitle: 'I. INTRODUCTION & HOOK (3 min)',
        themeColor: 'from-blue-600 to-cyan-600',
        lightBg: 'bg-slate-800', 
        textColor: 'text-cyan-400',
        borderColor: 'border-cyan-700/50',
        cards: [
          { 
            id: 'i1', 
            trigger: 'Hook: Speed Reading the Bible',

              'It is truly amazing how often and consistently this theme recurs!'
            ] 
          },
          {

            trigger: 'High Note Scripture: Psalm 68:5 (NWT Study Edition)', 
            details: [
              '*"A father of the fatherless and a protector of widows is God in his holy dwelling."*',

            ] 
          },
          { 
            id: 'i3',

            details: [
              '*"Using research tools available in your language, find one or two accounts involving widows in the Bible. What do these narratives teach you about how Jehovah views and cares for widows?"*',

            ] 
          }
        ]
      },
      {
        id: 'accounts',
        sectionTitle: 'II. BIBLICAL ACCOUNTS & SCRIPTURAL INSIGHTS (4 min)',
        themeColor: 'from-amber-600 to-orange-600',
        lightBg: 'bg-slate-800',
        textColor: 'text-amber-400',
        borderColor: 'border-amber-700/50',
        cards: [
          { 
            id: 'a1',

      {

        cards: [
          {

          {

            ] 
          },
          { 
            id: 'w3', 
            trigger: 'Video Viewing Prompt', 
            details: [
              '*"While we watch the following video, notice how Jehovah cares for widows today, and think about how we as individuals and as a congregation can show honor to widows today."*',

      },
      {
        id: 'discussion',

        themeColor: 'from-violet-600 to-purple-600',
        lightBg: 'bg-slate-800',
        textColor: 'text-violet-400',
        borderColor: 'border-violet-700/50',
        cards: [
          { 
            id: 'd1', 
            trigger: 'Assigned Question 1: Modern Care', 
            details: [
              '*"What did you learn from this video about how Jehovah cares for widows today?"*',

            ] 
          },
          {

            trigger: 'Assigned Question 2: Showing Honor', 
            details: [
              '*"Showing honor and support to widows is an important aspect of our worship. (Jas 1:27; \'Give consideration to\' study note on 1Ti 5:3, nwtsty). How can we show honor to widows today?"*',

      },
      {

        cards: [
          { 
            id: 'c1',

              'From Zarephath to the temple, and to our sisters today, Psalm 68:5 remains true: God is a protector of widows.'

          },
          { 
            id: 'c2',

    const FlashcardBubble = ({ card, textColor, borderColor, lightBg, onJumpToScript }) => {
      const [isPopped, setIsPopped] = useState(false);
      const [isPressing, setIsPressing] = useState(false);
      const pressTimer = useRef(null);
      const hasLongPressed = useRef(false);

      const startPress = () => {
        hasLongPressed.current = false;
        setIsPressing(true);
        pressTimer.current = setTimeout(() => {
          hasLongPressed.current = true;
          setIsPressing(false);
          if (navigator.vibrate) navigator.vibrate(50);
          onJumpToScript(card.id);
        }, 1100);
      };

      const cancelPress = () => {
        setIsPressing(false);
        clearTimeout(pressTimer.current);
      };

      const handleClick = () => {
        if (hasLongPressed.current) return;
        setIsPopped(!isPopped);
      };

      const holdStyles = isPressing 
        ? 'scale-95 opacity-80 ring-4 ring-cyan-500/60 transition-all duration-300' 
        : 'transition-all duration-200 hover:-translate-y-0.5';

      return (
        <div className="w-full flex justify-center relative my-2.5">
          {!isPopped ? (
            <div 
              onMouseDown={startPress}
              onMouseUp={cancelPress}
              onMouseLeave={cancelPress}
              onTouchStart={startPress}
              onTouchEnd={cancelPress}
              onTouchMove={cancelPress}
              onContextMenu={(e) => e.preventDefault()}
              onClick={handleClick}
              className={`
                cursor-pointer inline-flex items-center space-x-3 px-6 py-3.5 rounded-full
                ${lightBg} border-2 ${borderColor} shadow-lg 
                active:scale-95 select-none ${holdStyles}
              `}
            >
              <div className="p-1.5 rounded-full bg-slate-900/60">
                <MessageCircle className={`w-5 h-5 ${textColor}`} />
              </div>
              <span className={`font-semibold text-base sm:text-lg ${textColor} max-w-sm sm:max-w-none text-left`}>
                {card.trigger}
              </span>
            </div>
          ) : (
            <div 
              onMouseDown={startPress}
              onMouseUp={cancelPress}
              onMouseLeave={cancelPress}
              onTouchStart={startPress}
              onTouchEnd={cancelPress}
              onTouchMove={cancelPress}
              onContextMenu={(e) => e.preventDefault()}
              onClick={handleClick}
              className={`
                animate-pop-in cursor-pointer
                w-full max-w-2xl bg-slate-800/95 rounded-2xl shadow-2xl border-2 ${borderColor} p-6 relative overflow-hidden select-none
                ${holdStyles}
              `}
            >
              <div className="flex items-start justify-between mb-4 relative z-10">
                <div className="flex items-start space-x-3">
                  <Lightbulb className={`w-6 h-6 mt-1 flex-shrink-0 ${textColor}`} />
                  <h3 className={`font-bold text-lg sm:text-xl leading-snug ${textColor}`}>{card.trigger}</h3>
                </div>
              </div>
              
              <ul className="space-y-3 relative z-10">
                {card.details.map((detail, idx) => (
                  <li key={idx} className="flex items-start text-slate-200 text-base sm:text-lg font-normal leading-relaxed">
                    <ChevronRight className={`w-5 h-5 mt-1 mr-2.5 flex-shrink-0 ${textColor} opacity-70`} />
                    <span>
                      {detail.split('*').map((chunk, i) => i % 2 !== 0 ? <strong key={i} className="text-white italic">{chunk}</strong> : chunk)}
                    </span>
                  </li>
                ))}
              </ul>
              
              <div className="mt-6 flex justify-between items-center relative z-10 border-t border-slate-700/60 pt-3">
                <div className="text-xs text-slate-400 flex items-center">
                  <FileText className="w-3.5 h-3.5 mr-1 text-slate-400"/> Hold to open in script
                </div>
                <div className="flex items-center text-xs sm:text-sm font-medium text-slate-400">
                  <CheckCircle2 className="w-4 h-4 mr-1 text-slate-400" /> Tap card to close
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const PresentationTimer = () => {
      const TOTAL_SECONDS = 15 * 60; // 15-minute congregation part
      const [seconds, setSeconds] = useState(TOTAL_SECONDS);
      const [isRunning, setIsRunning] = useState(false);

      useEffect(() => {
        let interval = null;
        if (isRunning && seconds > 0) {
          interval = setInterval(() => setSeconds(s => s - 1), 1000);
        }
        return () => clearInterval(interval);
      }, [isRunning, seconds]);

      const formatTime = (totalSeconds) => {
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        return `${m}:${s.toString().padStart(2, '0')}`;
      };

      const toggle = () => setIsRunning(!isRunning);
      const reset = () => { setIsRunning(false); setSeconds(TOTAL_SECONDS); };
      const isLowTime = seconds < (3 * 60); // Low time threshold at 3 minutes

      return (
        <div className="bg-slate-800/90 border border-slate-700 text-white rounded-full shadow-lg px-3.5 py-1.5 sm:px-5 sm:py-2.5 flex items-center space-x-3 sm:space-x-5">
          <div className="flex items-center space-x-2">
            <span className="text-xs uppercase font-bold text-slate-400 tracking-wider hidden md:inline">Timer</span>
            <div className={`text-xl sm:text-2xl font-black tabular-nums tracking-tight ${isLowTime ? 'text-rose-400 animate-pulse' : 'text-slate-100'}`}>
              {formatTime(seconds)}
            </div>
          </div>
          
          <div className="flex items-center space-x-1 sm:space-x-2 border-l border-slate-700 pl-3 sm:pl-4">
            <button 
              onClick={toggle} 
              title={isRunning ? "Pause timer" : "Start timer"}
              className="p-1.5 sm:p-2 bg-slate-700 text-slate-100 rounded-full hover:bg-slate-600 transition-all active:scale-95"
            >
              {isRunning ? <Pause className="w-4 h-4" fill="currentColor" /> : <Play className="w-4 h-4" fill="currentColor" />}
            </button>
            <button 
              onClick={reset} 
              title="Reset timer to 15:00"
              className="p-1.5 sm:p-2 text-slate-400 hover:text-white rounded-full transition-colors active:scale-95"
            >
              <RotateCcw className="w-4 h-4" />
            </button>
          </div>
        </div>
      );
    };

    const FullScriptView = () => {
      return (
        <div className="max-w-3xl mx-auto px-4 pt-4 pb-36 text-base sm:text-lg text-slate-300 leading-relaxed space-y-6">
          
          <div className="text-center mb-10 border-b border-slate-800 pb-6">
            <h1 className="text-2xl sm:text-3xl font-extrabold text-white mb-2 tracking-tight">Jehovah's Care for Widows</h1>
            <p className="text-sm sm:text-base text-cyan-400 font-medium tracking-wide">15-Minute Congregation Discourse & Discussion</p>
          </div>

          {/* I. INTRODUCTION */}
          <div id="i1" className="scroll-mt-36 p-4 rounded-xl transition-colors">
            <h3 className="text-xl font-bold text-cyan-400 mb-3 tracking-wide">I. INTRODUCTION & HOOK (3 min)</h3>
            <p className="text-slate-200">If you have ever had the notion to speed read through the Bible—maybe to complete it in less than six months—one of the themes that will immediately pop out at you is Jehovah’s deep concern for widows, orphans, and foreign residents. It really is amazing.</p>
          </div>

          <div id="i2" className="scroll-mt-36 p-4 rounded-xl transition-colors">
            <p className="text-slate-200">We see this beautifully summarized for us in <strong>Psalm 68:5</strong>. The <em>New World Translation Study Edition</em> renders it this way:</p>
            <blockquote className="border-l-4 border-cyan-500 pl-4 my-3 bg-slate-800/60 py-3 pr-4 rounded-r-lg text-slate-100">
              <strong className="block text-cyan-400 text-sm font-semibold mb-1">Psalm 68:5</strong>
              "A father of the fatherless and a protector of widows is God in his holy dwelling."
            </blockquote>
            <p className="text-slate-200">But tonight, rather than just noting how <em>often</em> Jehovah mentions them, we want to slow down and look closely at <em>how</em> He interacts with them.</p>
          </div>

          <div id="i3" className="scroll-mt-36 p-4 rounded-xl transition-colors">
            <p className="text-slate-200">To begin tonight’s discussion, I’d like to ask for your thoughts on this question:</p>
            <div className="bg-cyan-950/40 border border-cyan-700/60 p-4 rounded-xl text-cyan-100 font-medium my-3">
              "Using research tools available in your language, find one or two accounts involving widows in the Bible. What do these narratives teach you about how Jehovah views and cares for widows?"
            </div>
            <p className="text-xs sm:text-sm text-cyan-300 italic">*(Pause for audience response, give a moment for friends to look up notes, and field comments.)*</p>
          </div>

          {/* II. BIBLICAL ACCOUNTS */}
          <div id="a1" className="scroll-mt-36 p-4 rounded-xl transition-colors">
            <h3 className="text-xl font-bold text-amber-400 mb-3 tracking-wide">II. BIBLICAL ACCOUNTS & AUDIENCE SHARING (4 min)</h3>
            <p className="font-semibold text-white">The Widow of Zarephath (1 Kings 17:8-24)</p>
            <p className="text-slate-200 mt-1">During a severe drought, Jehovah directed Elijah to a destitute, foreign widow in Zarephath who was gathering sticks to cook her final meal. She showed faith and shared her last morsel, and Jehovah miraculously sustained her jar of flour and jug of oil. Later, when her son died, Jehovah answered Elijah and resurrected the boy.</p>
            <p className="text-xs sm:text-sm text-amber-300/90 mt-2 font-medium">What this teaches: Jehovah notices the invisible, rewards faith over social standing, and acts as a fierce protector.</p>
          </div>

          <div id="a2" className="scroll-mt-36 p-4 rounded-xl transition-colors">
            <p className="font-semibold text-white">The Needy Widow at the Temple (Luke 21:1-4; Mark 12:41-44)</p>
            <p className="text-slate-200 mt-1">Jesus observed rich contributors putting in large gifts, but a needy widow dropped in two small coins (leptons)—her whole livelihood. Jesus highlighted her sacrifice, showing how deeply Jehovah values quiet, whole-souled devotion.</p>
          </div>

          <div id="a3" className="scroll-mt-36 p-4 rounded-xl transition-colors">
            <p className="font-semibold text-white">The Argument from Lesser to Greater (Luke 18:6-7)</p>
            <p className="text-slate-200 mt-1">Jesus used the illustration of the persistent widow and the unrighteous judge. In the <em>New World Translation</em> (as found on JW.org), Jesus says:</p>
            <blockquote className="border-l-4 border-amber-500 pl-4 my-3 bg-slate-800/60 py-3 pr-4 rounded-r-lg text-slate-100">
              <strong className="block text-amber-400 text-sm font-semibold mb-1">Luke 18:6, 7</strong>
              "Hear what the judge, although unrighteous, said! Certainly, then, will not God cause justice to be done for his chosen ones who cry out to him day and night, while he is patient toward them?"
            </blockquote>
            <p className="text-slate-200">If a corrupt, uncaring human judge eventually acts simply because she refuses to give up, how much more so our loving Heavenly Father who is eager—not reluctant—to act on behalf of His servants!</p>
          </div>

          {/* III. WORKBOOK & TRANSITION */}
          <div id="w1" className="scroll-mt-36 p-4 rounded-xl transition-colors">
            <h3 className="text-xl font-bold text-emerald-400 mb-3 tracking-wide">III. WORKBOOK COMFORT & VIDEO TRANSITION (2 min)</h3>
            <p className="text-slate-200">In our workbook, I think it is beautifully put and it's worth reading it directly:</p>
            <blockquote className="border-l-4 border-emerald-500 pl-4 my-3 bg-slate-800/60 py-3 pr-4 rounded-r-lg text-slate-100 text-base sm:text-lg italic">
              "If you are a widow, be assured that Jehovah understands your deepest feelings and needs. He will protect and support you, just as he has done for many in the past and continues to do today."
            </blockquote>
          </div>

          <div id="w2" className="scroll-mt-36 p-4 rounded-xl text-center">
            <p className="text-sm uppercase tracking-widest text-slate-400 font-semibold mb-2">*(Pause for effect)*</p>
            <p className="text-2xl sm:text-3xl font-extrabold text-emerald-300">Jehovah really does care for widows.</p>
          </div>

          <div id="w3" className="scroll-mt-36 p-4 rounded-xl transition-colors">
            <p className="text-slate-200">In the following video, let's keep two specific thoughts in mind:</p>
            <div className="bg-emerald-950/40 border border-emerald-700/60 p-4 rounded-xl text-emerald-100 font-medium my-3">
              "While we watch the following video, notice how Jehovah cares for widows today, and think about how we as individuals and as a congregation can show honor to widows today."
            </div>
            <p className="text-xs sm:text-sm text-emerald-400 italic">*(Play the video segment)*</p>
          </div>

          {/* IV. DISCUSSION */}
          <div id="d1" className="scroll-mt-36 p-4 rounded-xl transition-colors">
            <h3 className="text-xl font-bold text-violet-400 mb-3 tracking-wide">IV. POST-VIDEO DISCUSSION (4 min)</h3>
            <p className="text-slate-200">Thank you for your close attention. Let us examine the assigned questions:</p>
            <div className="bg-violet-950/40 border border-violet-700/60 p-4 rounded-xl text-violet-100 font-medium my-3 space-y-3">
              <p><strong>1. What did you learn from this video about how Jehovah cares for widows today?</strong></p>
              <p><strong>2. Showing honor and support to widows is an important aspect of our worship. (Jas 1:27; "Give consideration to" study note on 1Ti 5:3, nwtsty). How can we show honor to widows today?</strong></p>
            </div>
            <p className="text-xs sm:text-sm text-violet-300 italic">*(Invite audience participation on practical ways the congregation provides physical assistance, emotional presence, and inclusion.)*</p>
          </div>

          {/* V. CONCLUSION */}
          <div id="c1" className="scroll-mt-36 p-4 rounded-xl transition-colors">
            <h3 className="text-xl font-bold text-rose-400 mb-3 tracking-wide">V. CONCLUSION (2 min)</h3>
            <p className="text-slate-200">Thank you all for those heartfelt comments. From the widow in Zarephath to the widow at the temple, and to our dear sisters today, Psalm 68:5 remains true: God is a protector of widows.</p>
          </div>

          <div id="c2" className="scroll-mt-36 p-4 rounded-xl transition-colors">
            <p className="text-slate-200">And the beautiful privilege we have is that He often uses <em>us</em> to provide that protection and care. When we offer our time, our emotional support, and our deep respect to these faithful sisters, we are doing more than just being good friends. We are actively reflecting the heart of our Heavenly Father.</p>
            <p className="text-slate-200 mt-3 font-semibold text-white">Let’s all continue to look for ways to be His hands in showing that love—proving by our actions that Jehovah really does care for widows.</p>
          </div>

        </div>
      );
    };

    const App = () => {
      const [viewMode, setViewMode] = useState('mindmap');

      const handleJumpToScript = (sectionId) => {
        setViewMode('script');
        setTimeout(() => {
          const el = document.getElementById(sectionId);
          if (el) {
            const y = el.getBoundingClientRect().top + window.scrollY - 110;
            window.scrollTo({ top: y, behavior: 'smooth' });
            el.classList.add('bg-slate-800', 'ring-2', 'ring-cyan-400');
            setTimeout(() => {
              el.classList.remove('bg-slate-800', 'ring-2', 'ring-cyan-400');
            }, 1800);
          }
        }, 120);
      };

      return (
        <div className="relative min-h-screen bg-slate-900 text-slate-100">
          {/* Top Fixed Header with Timer and View Switcher */}
          <div className="fixed top-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-3 sm:px-6 py-2.5 flex justify-between items-center shadow-2xl">
            <PresentationTimer />

            <div className="bg-slate-800/90 border border-slate-700 p-1 rounded-full flex shadow-inner">
              <button 
                onClick={() => { window.scrollTo({top: 0}); setViewMode('mindmap'); }} 
                className={`px-3.5 sm:px-5 py-1.5 rounded-full font-bold text-xs sm:text-sm flex items-center transition-all ${
                  viewMode === 'mindmap' ? 'bg-cyan-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <Network className="w-4 h-4 sm:mr-1.5" /> <span className="hidden sm:inline">Mind Map</span>
              </button>
              <button 
                onClick={() => { window.scrollTo({top: 0}); setViewMode('script'); }} 
                className={`px-3.5 sm:px-5 py-1.5 rounded-full font-bold text-xs sm:text-sm flex items-center transition-all ${
                  viewMode === 'script' ? 'bg-cyan-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <FileText className="w-4 h-4 sm:mr-1.5" /> <span className="hidden sm:inline">Script</span>
              </button>
            </div>
          </div>

          {/* Main View Container */}
          <div className="pt-24 sm:pt-28">
            {viewMode === 'mindmap' ? (
              <div className="max-w-4xl mx-auto px-4 pb-36 sm:px-8">
                <div className="text-center mb-12 space-y-2">
                  <h1 className="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">
                    Jehovah's Care for Widows
                  </h1>
                  <p className="text-slate-400 text-sm sm:text-base max-w-xl mx-auto">
                    15-Minute Congregation Discourse. Tap a bubble to expand rehearsal notes. <br/>
                    <span className="text-cyan-300 font-medium">Press &amp; Hold any bubble to jump straight to the script.</span>
                  </p>
                </div>

                <div className="space-y-12">
                  {outlineData.map((section) => (
                    <div key={section.id} className="relative">
                      <div className="flex justify-center mb-6 sticky top-20 sm:top-24 z-20">
                        <div className={`bg-gradient-to-r ${section.themeColor} text-white font-extrabold text-sm sm:text-base px-5 py-2.5 rounded-2xl shadow-xl uppercase tracking-wider flex items-center justify-center gap-2.5 w-full sm:w-auto`}>
                          <BookOpen className="w-5 h-5 opacity-90 flex-shrink-0" />
                          <span>{section.sectionTitle}</span>
                        </div>
                      </div>

                      <div className="flex flex-col items-center space-y-3">
                        {section.cards.map((card) => (
                          <FlashcardBubble 
                            key={card.id}
                            card={card} 
                            textColor={section.textColor}
                            borderColor={section.borderColor}
                            lightBg={section.lightBg}
                            onJumpToScript={handleJumpToScript}
                          />
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ) : (
              <FullScriptView />
            )}
          </div>
        </div>
      );
    };

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
